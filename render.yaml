services:
  - type: web
    name: telegram-file-guard
    runtime: python

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: ENVIRONMENT
        value: production

      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DASHBOARD_TOKEN
        sync: false

      - key: WEBHOOK_SECRET
        sync: false

      - key: RENDER_EXTERNAL_URL
        sync: false

      - key: DELETE_ENABLED
        value: "true"

      - key: ALERT_ADMINS
        value: "true"

      - key: WEBHOOK_MAX_CONNECTIONS
        value: "40"

      - key: BLOCKED_EXTENSIONS
        sync: false