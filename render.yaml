services:
  - type: web
    name: telegram-file-guard
    runtime: python
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DASHBOARD_TOKEN
        sync: false

      - key: WEBHOOK_SECRET
        sync: false

      - key: DELETE_ENABLED
        value: "true"

      - key: ALERT_ADMINS
        value: "true"

      - key: BLOCKED_EXTENSIONS
        value: ".exe,.bat,.vbs,.ps1,.sh,.msi,.scr"